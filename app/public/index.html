<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Loan EMI Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .card { border-radius: 12px; }
    #result-panel { display: none; }
    .pod-badge { font-size: 0.75rem; }
  </style>
</head>
<body>
<div class="container py-5" style="max-width: 700px;">
  <h2 class="mb-4 text-center">Loan EMI Calculator</h2>

  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <form id="emi-form">
        <div class="mb-3">
          <label class="form-label">Loan Amount (P)</label>
          <input type="number" id="principal" class="form-control" placeholder="e.g. 500000" min="1" required>
          <div class="invalid-feedback">Must be a positive number.</div>
        </div>
        <div class="mb-3">
          <label class="form-label">Annual Interest Rate (%)</label>
          <input type="number" id="rate" class="form-control" placeholder="e.g. 12" min="0.01" step="0.01" required>
          <div class="invalid-feedback">Must be a positive number.</div>
        </div>
        <div class="mb-3">
          <label class="form-label">Tenure (months)</label>
          <input type="number" id="months" class="form-control" placeholder="e.g. 24" min="1" required>
          <div class="invalid-feedback">Must be a positive integer.</div>
        </div>
        <button type="submit" class="btn btn-primary w-100">Calculate EMI</button>
      </form>
    </div>
  </div>

  <!-- Result panel (hidden until first calculation) -->
  <div id="result-panel" class="card shadow-sm mb-4 border-success">
    <div class="card-body">
      <h5 class="card-title text-success">Result</h5>
      <table class="table table-sm mb-1">
        <tr><th>Monthly EMI</th><td id="res-emi"></td></tr>
        <tr><th>Total Payment</th><td id="res-total"></td></tr>
        <tr><th>Total Interest</th><td id="res-interest"></td></tr>
      </table>
      <span class="badge bg-secondary pod-badge">Served by: <span id="res-pod"></span></span>
    </div>
  </div>

  <!-- History table -->
  <div class="card shadow-sm">
    <div class="card-body">
      <h5 class="card-title">Last 10 Calculations</h5>
      <div class="table-responsive">
        <table class="table table-sm table-striped" id="history-table">
          <thead>
            <tr>
              <th>Principal</th><th>Rate %</th><th>Months</th>
              <th>EMI</th><th>Pod</th><th>Time</th>
            </tr>
          </thead>
          <tbody id="history-body">
            <tr><td colspan="6" class="text-muted">No history yet.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
  // Load history on page load
  loadHistory();

  $('#emi-form').on('submit', function(e) {
    e.preventDefault();

    const principal = parseFloat($('#principal').val());
    const rate = parseFloat($('#rate').val());
    const months = parseInt($('#months').val());

    // Client-side validation
    let valid = true;
    if (!principal || principal <= 0) { $('#principal').addClass('is-invalid'); valid = false; }
    else { $('#principal').removeClass('is-invalid'); }
    if (!rate || rate <= 0) { $('#rate').addClass('is-invalid'); valid = false; }
    else { $('#rate').removeClass('is-invalid'); }
    if (!months || months <= 0) { $('#months').addClass('is-invalid'); valid = false; }
    else { $('#months').removeClass('is-invalid'); }
    if (!valid) return;

    $.ajax({
      url: '/api/emi',
      method: 'POST',
      contentType: 'application/json',
      data: JSON.stringify({ principal, rate, months }),
      success: function(data) {
        $('#res-emi').text(data.emi.toLocaleString());
        $('#res-total').text(data.totalPayment.toLocaleString());
        $('#res-interest').text(data.totalInterest.toLocaleString());
        $('#res-pod').text(data.servedBy);
        $('#result-panel').show();
        loadHistory();
      },
      error: function(xhr) {
        alert(xhr.responseJSON?.error || 'Server error');
      }
    });
  });

  function loadHistory() {
    $.get('/api/history', function(data) {
      const tbody = $('#history-body');
      if (!data.length) {
        tbody.html('<tr><td colspan="6" class="text-muted">No history yet.</td></tr>');
        return;
      }
      tbody.html(data.map(r => `
        <tr>
          <td>${r.principal.toLocaleString()}</td>
          <td>${r.rate}</td>
          <td>${r.months}</td>
          <td>${r.emi.toLocaleString()}</td>
          <td><span class="badge bg-secondary">${r.servedBy}</span></td>
          <td>${new Date(r.createdAt).toLocaleTimeString()}</td>
        </tr>
      `).join(''));
    });
  }
</script>
</body>
</html>
